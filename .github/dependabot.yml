version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      # One PR per batch instead of one per advisory: the lockfile is shared,
      # so separate PRs only multiply rebases and CI runs.
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
      npm-production:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - '*'
